name: Starrypad
options:
  bundleIdPrefix: com.purinzan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Starrypad:
    type: application
    platform: iOS
    sources:
      - path: Starrypad
      # A target has no `resources:` key; xcodegen silently ignores one, and
      # the build still succeeds with an empty bundle, which shows up only as
      # silence at runtime. Count the wavs in the .app after touching this.
      - path: Samples
        buildPhase: resources
      - path: Art
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Starrypad/Info.plist
      properties:
        CFBundleDisplayName: Starrypad
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        # Portrait only, because that is the only way this is laid out: a
        # square grid with the transport under it. Declaring an orientation
        # the app does not actually support is a rejection, and rightly.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Nothing here encrypts anything beyond what iOS does for itself, and
        # saying so up front skips the compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Background audio keeps the engine alive when the screen locks, which
        # matters for a pad you are playing from a connected controller.
        UIBackgroundModes:
          - audio
        # Required before iOS will even show the microphone prompt; without it
        # the app is terminated the moment it asks.
        NSMicrophoneUsageDescription: >-
          Starrypad records short sounds from the microphone so you can play
          them on a pad. Recordings stay on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purinzan.starrypad
        # iPhone only. An app that claims the iPad has to be laid out for one
        # and photographed on one; this is a phone instrument.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # Signed for the device, because the point of this app is a class
        # compliant USB pad plugged into the phone, and the simulator has no
        # USB. Automatic signing renews the profile as it expires.
        DEVELOPMENT_TEAM: F7TP2WY85S
        CODE_SIGN_STYLE: Automatic
